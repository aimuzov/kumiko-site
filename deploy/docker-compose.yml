# Сайт на сервере проектов. Порты 80/443 занимает общий Caddy
# из aimuzov/infra-server, он проксирует сюда домен через сеть `edge`.

name: kumiko-site

x-logging: &logging
  driver: json-file
  options:
    max-size: '5m'
    max-file: '2'

services:
  site:
    build:
      context: ..
      dockerfile: deploy/frontend.Dockerfile
      secrets: [env]
    image: kumiko-site
    container_name: kumiko-site
    restart: unless-stopped
    networks:
      - edge
    logging: *logging

# Переменные сборки лежат в `/srv/kumiko-site/.env`, образец -- `.env.example`.
secrets:
  env:
    file: ../.env

networks:
  edge:
    name: edge
    external: true
